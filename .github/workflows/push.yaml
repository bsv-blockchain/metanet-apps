name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1']
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false
    - name: Verify patched Node and native primitives
      env:
        EXPECTED_NODE: ${{ matrix.node-version }}
      run: |
        node -e 'const assert=require("node:assert/strict");const zlib=require("node:zlib");const crypto=require("node:crypto");assert.equal(process.versions.node,process.env.EXPECTED_NODE);const input=Buffer.from("metanet-apps native check");assert.deepEqual(zlib.brotliDecompressSync(zlib.brotliCompressSync(input)),input);assert.equal(crypto.randomBytes(32).length,32)'
    - run: npm ci
    - run: npm run lint:ci --if-present
    - run: npm run test:coverage --if-present
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0561704f0f02c16a585d4c7555e57fa2e44cf909 # v5.5.2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
      with:
        node-version: '24.22.1'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false
    - name: Verify publishing runtime
      run: node -e 'require("node:assert/strict").equal(process.versions.node, "24.22.1")'
    - name: Pin npm CLI for trusted publishing
      run: npm install --global npm@11.12.1
    - run: npm ci
    - run: npm run build
    - name: Check if version already published
      id: check-version
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")

        echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"

        # Check if this version exists on npm
        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
          echo "Version $PACKAGE_VERSION already published"
          echo "should_publish=false" >> $GITHUB_OUTPUT
        else
          echo "Version $PACKAGE_VERSION not yet published"
          echo "should_publish=true" >> $GITHUB_OUTPUT
        fi
    - name: Publish to npm
      if: steps.check-version.outputs.should_publish == 'true'
      run: npm publish
    - name: Skip publishing
      if: steps.check-version.outputs.should_publish == 'false'
      run: echo "Skipping publish - version already exists on npm"
